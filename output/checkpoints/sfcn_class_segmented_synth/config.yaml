brain_generator:
  atlas_res: 1.0
  bias_field_rng:
  - 0.0
  - 0.5
  blur_sigma: 0.25
  contrast_range:
  - 0.8
  - 1.2
  distribution: uniform
  gibbs_alpha: 0.4
  hist_control_points: 5
  log_gamma_std: 0.1
  max_res_aniso: 2.0
  max_res_iso: 2.0
  mean_loc: 125.0
  mean_scale: 125.0
  min_res: 0.8
  n_channels: 1
  noise_mean: 0.02
  noise_std: 0.015
  output_shape:
  - 182
  - 218
  - 182
  prob:
    affine: 0.0
    bias: 0.0
    blur: 0.0
    contrast: 0.0
    flip: 0.0
    gamma: 0.0
    gibbs: 0.0
    hist_shift: 0.0
    noise: 0.0
    resolution: 0.0
    rician: 0.0
    scale_int: 0.0
    shift_int: 0.0
  return_gradients: false
  rician_std: 0.01
  rotation_range: 10
  scaling_range: 0.1
  shear_bounds: 0.005
  shift_offset: 0.1
  std_loc: 17.5
  std_scale: 17.5
  thickness: null
  translation_bounds: false
  use_dynamic_resolution: true
  use_hemisphere_aware_flip: true
  use_intensity_clip_normalize: true
  use_random_cropping: true
  use_specific_stats_for_channel: false
data:
  age_key: age
  age_max: 80
  age_min: 20
  cache_dir: data/cache
  cache_mode: memory
  cache_size: 0
  image_key: image_path
  num_workers: 2
  persistent_workers: true
  pin_memory: true
  pin_memory_device: cuda
  prefetch_factor: 2
  preload: true
  real_data_dir: /mnt/c/Projects/thesis_project/Data/brain_age_preprocessed/
  segmented_data_dir: /mnt/c/Projects/thesis_project/Data/brain_age_segmented/
  shared_cache: 0
  target_shape:
  - 160
  - 192
  - 160
  test_csv: /mnt/c/Projects/thesis_project/brain_age_pred/data/labels/train_debug_local.csv
  train_csv: /mnt/c/Projects/thesis_project/brain_age_pred/data/labels/train_debug_local.csv
  val_csv: /mnt/c/Projects/thesis_project/brain_age_pred/data/labels/train_debug_local.csv
  weight_key: sample_weight
device: cuda
model:
  checkpoint: null
  dropout_rate: 0.1
  in_channels: 1
  type: sfcn_class
  use_attention: false
output:
  checkpoint_dir: checkpoints
  experiment_name: sfcn_class_segmented_synth
  log_dir: logs
  output_dir: /mnt/c/Projects/thesis_project/brain_age_pred/output
seed: 42
training:
  batch_size: 1
  early_stopping_patience: 300
  epochs: 400
  gradient_accumulation_steps: 1
  learning_rate: 0.002
  loss: kl_div
  loss_params:
    delta: 1.0
    mae_weight: 0.5
  optimizer: adamw
  scheduler: step
  scheduler_params:
    T_max: 100
    epochs: 60
    eta_min: 1.0e-05
    gamma: 0.3
    step_size: 30
    steps_per_epoch: 534
  use_amp: false
  weight_decay: 0.0
wandb:
  entity: null
  project: brain_age_synth
  use_wandb: true
