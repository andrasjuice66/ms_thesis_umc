# ────────────────────────────  DATA  ──────────────────────────── #
data:
  real_data_dir: "/mnt/c/Projects/thesis_project/Data/brain_age_preprocessed_no_csf/"   
  train_csv: "/mnt/c/Projects/thesis_project/brain_age_pred/data/labels/train_t1_labels.csv"
  val_csv:   "/mnt/c/Projects/thesis_project/brain_age_pred/data/labels/val_t1_labels.csv"
  test_csv:  "/mnt/c/Projects/thesis_project/brain_age_pred/data/labels/test_t1_labels.csv"

  image_key:  "image_path"
  age_key:    "age"
  weight_key: "age_modality_frequency"             

  # loading / caching
  cache_dir: "data/cache"
  cache_mode: "memory"   
  cache_size: 0            
  shared_cache: 0
  preload: true
  num_workers: 2
  pin_memory: false
  pin_memory_device: ""
  persistent_workers: true
  prefetch_factor: 4
  target_shape: [160, 192, 160]            # (D,H,W) after optional resize
  age_min: 20
  age_max: 80

  use_weighted_sampling: false  

# ───────────────────────────  MODEL  ──────────────────────────── #
model:
  type: "brainagenext"                             # sfcn | resnet3d | efficientnet3d
  in_channels: 1
  dropout_rate: 0.2 
  use_attention: false                   
  checkpoint: #"/mnt/c/Projects/thesis_project/output/brainagenext_local/checkpoints/brainagenext_baseline/brainagenext_baseline_best_mae.pt"

# ─────────────────────────  AUGMENTATION  ─────────────────────── #
# -------------------------------------------------------------------------
# Augmentation settings
# Every key here maps 1-to-1 to a keyword argument or probability override
# accepted by the AugmentationPipeline class.
# -------------------------------------------------------------------------
augmentation:
  use_augmentation: false

# ──────────────────────────  TRAINING  ────────────────────────── #
training:
  batch_size: 1
  epochs: 150

  # optimiser & LR
  learning_rate: 0.00001 #0.002193
  optimizer: "adamw"                       # adam | adamw | sgd | rmsprop | radam | novograd
  scheduler: "step"                      # cosine | plateau | onecycle | step | none
  scheduler_params:
    T_max: 100
    eta_min: 0.00001
    epochs: 200
    steps_per_epoch: 534

    step_size: 30
    gamma: 0.3

  # losses
  loss: "huber_mae"                        # mse | mae | huber | huber_mae | weighted_mse
  loss_params:
    delta: 1.0
    mae_weight: 0.5

  # misc
  early_stopping_patience: 30
  gradient_accumulation_steps: 1
  use_amp: true                            # mixed precision if CUDA present

# ────────────────────────────  OUTPUT  ────────────────────────── #
output:
  output_dir: "/mnt/c/Projects/thesis_project/run_output/brainagenext_baseline_t1"
  checkpoint_dir: "checkpoints"
  log_dir: "logs"
  experiment_name: brainagenext_baseline_t1 #"brain_age_with_tumors"                   # auto-generate if left null

# ─────────────────────────────  W&B  ──────────────────────────── #
wandb:
  use_wandb: true                         # still requires $WANDB_API env-var
  project: "paper_check"

  entity: null

# ───────────────────────── MISCELLANEOUS ───────────────────────── #
seed: 42
device: "cuda"                              # cuda if available, else cpu