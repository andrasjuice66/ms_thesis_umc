# ────────────────────────────  DATA  ──────────────────────────── #
data:
  real_data_dir: "/mnt/c/Projects/thesis_project/Data/brain_age_preprocessed_no_csf/"   
  train_csv: "/mnt/c/Projects/thesis_project/brain_age_pred/data/labels/train_labels.csv"
  val_csv:   "/mnt/c/Projects/thesis_project/brain_age_pred/data/labels/val_labels.csv"
  test_csv:  "/mnt/c/Projects/thesis_project/brain_age_pred/data/labels/test_labels.csv"

  image_key:  "image_path"
  age_key:    "age"
  weight_key: "age_modality_frequency"             

  # loading / caching
  cache_dir: "data/cache"
  cache_mode: "memory"   
  cache_size: 0            
  shared_cache: 0
  preload: true
  num_workers: 2
  pin_memory: false
  pin_memory_device: ""
  persistent_workers: true
  prefetch_factor: 4
  target_shape: [160, 192, 160]            # (D,H,W) after optional resize
  age_min: 20
  age_max: 80

# ───────────────────────────  MODEL  ──────────────────────────── #
model:
  type: "brainagenext"                             # sfcn | resnet3d | efficientnet3d
  in_channels: 1
  dropout_rate: 0.2
  use_attention: false                   
  checkpoint: #"/home/ajoos1/brain_age_pred/output/checkpoints/brainagenext_dom_rand/brainagenext_dom_rand_best_mae.pt"

# ─────────────────────────  AUGMENTATION  ─────────────────────── #
# -------------------------------------------------------------------------
# Augmentation settings
# Every key here maps 1-to-1 to a keyword argument or probability override
# accepted by the AugmentationPipeline class.
# -------------------------------------------------------------------------
augmentation:
  use_augmentation: true
  use_spatial_transforms: true
  use_intensity_transforms: true

  image_key: "image"  # Key for the image in the data dictionary
    
  # Transform probabilities
  transform_probs:
    # Geometric transforms
    flip: 0
    affine: 0.5
    zoom: 0.5
    rotate: 0.5

    
    # Intensity transforms
    contrast: 0.5
    gamma: 0.5
    scale_int: 0  # Scale intensity
    shift_int: 0  # Shift intensity
    hist_shift: 0  # Histogram shift
    
    # Noise/artifact transforms
    blur: 0           # Up from 0.2
    bias: 0.5
    noise: 0.5
    rician: 0
    gibbs: 0
    
    # Resolution/dropout transforms
    resolution: 0     # Up from 0.2
    coarse_do: 0      # Up from 0.0
    
    # TorchIO transforms (controlled by probabilities)
    spike: 0
    ghost: 0.5
    motion: 0.5
    swap: 0.5

  # Geometric transform parameters #   torchio.transforms.RandomAffine(scales=(0.05,0.05,0.05), degrees=(5,5,5), translation=(10,10,10), include=['img'], p=0.5),
  scaling_range: [0.95, 1.05]    
  rotation_range: 5.0  
  shearing_bounds: 0.2
  translation_range: 10.0
  
  # Intensity transform parameters
  contrast_range: [0.6, 3.0]  # RandAdjustContrastd(keys=["img"], gamma=(0.6, 3.0), prob=0.5),
  log_gamma_std: 0.8  # S        torchio.transforms.RandomGamma(log_gamma=0.8, keys=["img"], include=['img'], p=0.5),

  bias_field_range: [-0.5, 0.1]      #RandBiasFieldd(keys=["img"], degree=5, coeff_range=(-0.5, 0.1), prob=0.5), ]
  bias_field_degree: 5


  # Noise parameters
  noise_mean: 0.0          #         torchio.RandomNoise(keys=["img"], std=[0,0.5], p=0.5, include=['img']),
  noise_std: 0.2     # Standard deviation range for noise



  rician_std: 0.08  # Standard deviation for Rician noise
  gibbs_alpha: [0.0, 1.0]  # Alpha range for Gibbs noise
  
  # Blur parameters
  blur_sigma: [0.5, 2.0]  # Sigma range for Gaussian smoothing
  
  # Intensity shift parameters
  shift_offset: [-0.1, 0.1]      # More conservative
  hist_control_points: [4, 12]  # Control points for histogram shift
  
  # Resolution/artifact parameters
  max_res_iso: 1.8  # Maximum isotropic resolution
  min_res: 1.0  # Minimum resolution
  
  # Dropout parameters
  coarse_dropout_size: [20, 20, 20]  # Size of dropout regions
  coarse_dropout_holes: 8  # Number of dropout holes
  
  # Spatial crop parameters
  output_shape: [160, 192, 160]  # Final shape after transformations
  random_center: true  # Use random center for spatial crop
  
  # TorchIO specific parameters
  spike_num: [1, 6]  # Number of spikes
  spike_intensity: [0.1, 0.6]  # Intensity of spikes

  #Ghost parameters    torchio.transforms.RandomGhosting(num_ghosts=(1, 4), intensity=(0.1, 0.6), keys=["img"], p=0.5, include=['img']),
  ghost_num: [1, 4]  # Number of ghosts
  ghost_intensity: [0.1, 0.6]  # Intensity of ghosts


  # Swap parameters
  swap_patch_size: 15
  swap_num_iterations: 100

  # Motion parameters
  motion_degrees: 3  # torchio.transforms.RandomMotion(degrees=(3), translation=(5), num_transforms=4, keys=["img"], p=0.5, include=['img']),
  motion_translation: 5 
  motion_num_transforms: 4


  # Rotation parameters
  rotate_range_x: 0.1
  rotate_range_y: 0.1
  rotate_range_z: 0.1

  # Zoom parameters
  zoom_min: 0.95
  zoom_max: 1.00

# ──────────────────────────  TRAINING  ────────────────────────── #
training:
  batch_size: 1
  epochs: 150

  # optimiser & LR
  learning_rate: 0.00001 #0.002193
  weight_decay:  0.001
  optimizer: "adamw"                       # adam | adamw | sgd | rmsprop | radam | novograd
  scheduler: "step"                      # cosine | plateau | onecycle | step | none
  scheduler_params:
    T_max: 100
    eta_min: 0.00001
    epochs: 200
    steps_per_epoch: 534

    step_size: 10
    gamma: 0.8

  # losses
  loss: "huber"                      
  loss_params:
    delta: 5.0
    mae_weight: 0.5

  # misc
  early_stopping_patience: 30
  gradient_accumulation_steps: 1
  use_amp: true                            # mixed precision if CUDA present

# ────────────────────────────  OUTPUT  ────────────────────────── #
output:
  output_dir: "/mnt/c/Projects/thesis_project/run_output/brainagenext_augmented"
  checkpoint_dir: "checkpoints"
  log_dir: "logs"
  experiment_name: brainagenext_augmented #"brain_age_with_tumors"                   # auto-generate if left null

# ─────────────────────────────  W&B  ──────────────────────────── #
wandb:
  use_wandb: true                         # still requires $WANDB_API env-var
  project: "brain_age_results"

  entity: null

# ───────────────────────── MISCELLANEOUS ───────────────────────── #
seed: 42
device: "cuda"                              # cuda if available, else cpu