# ────────────────────────────  DATA  ──────────────────────────── #
data:
  train_csv: "/home/ajoos/brain_age_pred/data/labels/train.csv"
  val_csv:   "/home/ajoos/brain_age_pred/data/labels/val.csv"
  test_csv:  "/home/ajoos/brain_age_pred/data/labels/test.csv"

  real_data_dir: "/scratch-shared/ajoos/brain_age_preprocessed_converted/"   

  image_key:  "image_path"
  age_key:    "age"
  weight_key: "age_modality_frequency"             

  # loading / caching
  cache_dir: "data/cache"
  cache_mode: "memory"   
  cache_size: 0            
  shared_cache: 0
  preload: true
  num_workers: 8
  pin_memory: false
  pin_memory_device: ""
  persistent_workers: true
  prefetch_factor: 4
  target_shape: [160, 192, 160]            # (D,H,W) after optional resize
  age_min: 20
  age_max: 80

# ───────────────────────────  MODEL  ──────────────────────────── #
model:
  type: "brainagenext"                             # sfcn | resnet3d | efficientnet3d
  in_channels: 1
  dropout_rate: 0.2
  use_attention: false                   
  checkpoint: "/home/ajoos/brain_age_pred/output/checkpoints/brainagenext_dom_rand/brainagenext_dom_rand_best_mae.pt"

# ─────────────────────────  AUGMENTATION  ─────────────────────── #
# -------------------------------------------------------------------------
# Augmentation settings
# Every key here maps 1-to-1 to a keyword argument or probability override
# accepted by the AugmentationPipeline class.
# -------------------------------------------------------------------------
augmentation:
  use_augmentation: true
  augmentation_strength: 1.2  # Overall augmentation strength multiplier

  image_key: "image"  # Key for the image in the data dictionary
    
  # Transform probabilities
  transform_probs:
    # Geometric transforms
    flip: 0.5
    affine: 0.5
    
    # Intensity transforms
    contrast: 0.6
    gamma: 0.5
    scale_int: 0.4  # Scale intensity
    shift_int: 0.4  # Shift intensity
    hist_shift: 0.3  # Histogram shift
    
    # Noise/artifact transforms
    blur: 0.4           # Up from 0.2
    bias: 0.5
    noise: 0.4
    rician: 0.3
    gibbs: 0.3
    
    # Resolution/dropout transforms
    resolution: 0.4     # Up from 0.2
    coarse_do: 0.2      # Up from 0.0
    
    # TorchIO transforms (controlled by probabilities)
    spike: 0.2
    ghost: 0.3
    motion: 0.1
    swap: 0.1

  # Geometric transform parameters
  scaling_range: [0.9, 1.1]      # More conservative
  rotation_range: 10.0  # Maximum rotation in degrees
  shearing_bounds: 0.2           # More conservative  
  
  # Intensity transform parameters
  contrast_range: [0.7, 1.3]  # Range for contrast adjustment
  log_gamma_std: 0.3  # Standard deviation for gamma transformation
  bias_field_range: [0.0, 0.4]  # Range for bias field artifact
  
  # Noise parameters
  noise_mean: 0.0          # ❌ Fix this! Was 0.2
  noise_std: 0.05          # ✅ Keep
  rician_std: 0.08  # Standard deviation for Rician noise
  gibbs_alpha: [0.0, 1.0]  # Alpha range for Gibbs noise
  
  # Blur parameters
  blur_sigma: [0.5, 2.0]  # Sigma range for Gaussian smoothing
  
  # Intensity shift parameters
  shift_offset: [-0.1, 0.1]      # More conservative
  hist_control_points: [4, 12]  # Control points for histogram shift
  
  # Resolution/artifact parameters
  max_res_iso: 1.8  # Maximum isotropic resolution
  min_res: 1.0  # Minimum resolution
  
  # Dropout parameters
  coarse_dropout_size: [20, 20, 20]  # Size of dropout regions
  coarse_dropout_holes: 8  # Number of dropout holes
  
  # Spatial crop parameters
  output_shape: [160, 192, 160]  # Final shape after transformations
  random_center: true  # Use random center for spatial crop
  
  # TorchIO specific parameters
  spike_num: [1, 6]  # Number of spikes
  spike_intensity: [0.1, 0.6]  # Intensity of spikes
  ghost_num: [2, 10]  # Number of ghosts

# ──────────────────────────  TRAINING  ────────────────────────── #
training:
  batch_size: 8
  epochs: 150

  # optimiser & LR
  learning_rate: 0.0001 #0.002193
  weight_decay:  0.0001
  optimizer: "adamw"                       # adam | adamw | sgd | rmsprop | radam | novograd
  scheduler: "step"                      # cosine | plateau | onecycle | step | none
  scheduler_params:
    T_max: 100
    eta_min: 0.00001
    epochs: 200
    steps_per_epoch: 534

    step_size: 30
    gamma: 0.3

  # losses
  loss: "mse"                        # mse | mae | huber | huber_mae | weighted_mse
  loss_params:
    delta: 1.0
    mae_weight: 0.5

  # misc
  early_stopping_patience: 30
  gradient_accumulation_steps: 1
  use_amp: true                            # mixed precision if CUDA present

# ────────────────────────────  OUTPUT  ────────────────────────── #
output:
  output_dir: "/home/ajoos/brain_age_pred/output"
  checkpoint_dir: "checkpoints"
  log_dir: "logs"
  experiment_name: brainagenext_augmented #"brain_age_with_tumors"                   # auto-generate if left null

# ─────────────────────────────  W&B  ──────────────────────────── #
wandb:
  use_wandb: true                         # still requires $WANDB_API env-var
  project: "brain_age_results"

  entity: null

# ───────────────────────── MISCELLANEOUS ───────────────────────── #
seed: 42
device: "cuda"                              # cuda if available, else cpu