# DEBUG VERSION - Safer settings to identify NaN issue
# ────────────────────────────  DATA  ──────────────────────────── #
data:
  data_dir: "/scratch-shared/ajoos/"               # root that contains all images
  train_csv: "/home/ajoos/brain_age_pred/data/labels/train.csv"
  val_csv:   "/home/ajoos/brain_age_pred/data/labels/val.csv"
  test_csv:  "/home/ajoos/brain_age_pred/data/labels/test.csv"

  image_key:  "image_path"
  age_key:    "age"
  weight_key: "sample_weight"             

  # loading / caching
  cache_dir: "data/cache"
  cache_mode: "memory"   
  cache_size: 0            
  shared_cache: 0
  preload: true
  num_workers: 8
  pin_memory: false
  persistent_workers: true
  pin_memory_device: ""
  prefetch_factor: 4

  target_shape: [182, 218, 182]            # (D,H,W) after optional resize

# ───────────────────────────  MODEL  ──────────────────────────── #
model:
  type: "brainagenext"                             # sfcn | resnet3d | efficientnet3d
  in_channels: 1
  dropout_rate: 0.1                      # REDUCED from 0.2
  use_attention: false                   
  checkpoint: null
  model_id: "B"  # Options: "S", "B", "M", "L"
  kernel_size: 3
  deep_supervision: false
  feature_size: 512
  hidden_size: 64

# ────────────────  DOMAIN-RANDOMISATION / AUGS  ───────────────── #
domain_randomization:
  use_domain_randomization: false          # DISABLED for debugging
  progressive_epochs: 50                  
  progressive_start: 0.2                  

  # ── global toggles ────────────────────────────────────────────────────
  use_torchio: false                     
  output_shape:        [182, 218, 182]   

  transform_probs:
    flip: 0.5        # REDUCED
    affine: 0.3      # REDUCED 
    contrast: 0.3    # REDUCED
    gamma: 0.2       # REDUCED
    blur: 0.2        # REDUCED
    bias: 0.3        # REDUCED
    scale_int: 0.2   # REDUCED
    shift_int: 0.2   # REDUCED
    hist_shift: 0.1  # REDUCED
    noise: 0.1       # REDUCED
    rician: 0.1      # REDUCED
    gibbs: 0.1       # REDUCED
    resolution: 0.3  # REDUCED
    coarse_do: 0.0   
    spike: 0.0       
    ghost: 0.0       
    crop: 0.5        # REDUCED

  # ── geometric parameters ─────────────────────────────────────────────
  enable_spatial: true
  scaling_range: [0.9, 1.1]        # REDUCED from [0.8, 1.2]
  rotation_range: 10.0             # REDUCED from 15.0
  shearing_bounds: 0.008           # REDUCED from 0.012
  nonlinear_std: 2.0               # REDUCED from 4.0
  translation_bounds: false        

  # ── intensity parameters ─────────────────────────────────────────────
  contrast_range: [0.8, 1.2]       # REDUCED from [0.6, 1.6]
  log_gamma_std: 0.10             # REDUCED from 0.20
  bias_field_range: [0.0, 0.5]     # REDUCED from [0.0, 0.7]
  shift_intensity_offsets: [-0.05, 0.05]  # REDUCED from [-0.1, 0.1]
  histogram_num_control_points: [5, 8]    # REDUCED from [5, 10]

  # ── resolution / simulation ──────────────────────────────────────────
  enable_simulation: true
  max_res_iso: 3.0                 # REDUCED from 4.0
  resolution_range: [1.0, 1.3]     # REDUCED from [1.0, 1.5]
  coarse_dropout_size: [20, 20, 20]  

# ──────────────────────────  TRAINING  ────────────────────────── #
training:
  batch_size: 2                    # REDUCED for debugging
  epochs: 150

  # optimiser & LR - SAFER SETTINGS
  learning_rate: 0.0001            # MUCH LOWER - was 0.001
  weight_decay:  0.00001
  optimizer: "adamw"               # CHANGED from sgd to adamw (more stable)
  scheduler: "cosine"                      
  scheduler_params:
    T_max: 150
    eta_min: 0.00001
    epochs: 150
    steps_per_epoch: 2122          # Updated for batch_size=2

  # losses
  loss: "mse"                        
  loss_params:
    delta: 1.0
    mae_weight: 0.5

  # misc
  early_stopping_patience: 8
  gradient_accumulation_steps: 1
  use_amp: false                   # DISABLED for debugging - AMP can cause NaN

# ────────────────────────────  OUTPUT  ────────────────────────── #
output:
  output_dir: "/home/ajoos/brain_age_pred/output"
  checkpoint_dir: "checkpoints"
  log_dir: "logs"
  experiment_name: "brainagenext_debug"  # Set specific name

# ─────────────────────────────  W&B  ──────────────────────────── #
wandb:
  use_wandb: true                         
  project: "brainage-model-training"
  entity: null

# ───────────────────────── MISCELLANEOUS ───────────────────────── #
seed: 42
device: null 