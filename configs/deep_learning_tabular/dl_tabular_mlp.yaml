# Deep Learning Tabular Configuration - Simple MLP Architecture
# Uses a powerful but simpler MLP instead of ResNet-style architecture

experiment_name: "dl_tabular_mlp"
seed: 42
use_wandb: true
wandb_project: "rerun_experiments"

# Data configuration
data:
  train_csv: "/mnt/c/Projects/thesis_project/brain_age_pred/data/labels_for_ml/train_labels.csv"
  val_csv: "/mnt/c/Projects/thesis_project/brain_age_pred/data/labels_for_ml/val_labels.csv"
  test_csv: "/mnt/c/Projects/thesis_project/brain_age_pred/data/labels_for_ml/test_labels.csv"
  segmented_data_dir: "/mnt/c/Projects/thesis_project/Data/brain_age_segmented"

# Preprocessing configuration
preprocessing:
  scaler: "standard"
  handle_missing: "median"

# Model architecture configuration
model:
  architecture: "mlp"  # Simple but powerful MLP
  hidden_dims: [1024, 512, 256, 128]  # Larger hidden layers for MLP
  dropout: 0.4  # Higher dropout for regularization
  use_attention: false  # Not used in MLP

# Training configuration
training:
  batch_size: 256  # Larger batch size for MLP
  epochs: 150
  learning_rate: 0.0005  # Lower learning rate
  optimizer: "adamw"
  weight_decay: 0.0001
  scheduler: "cosine"  # Cosine annealing
  grad_clip: 1.0
  early_stopping_patience: 25

# Output configuration
output:
  output_dir: "output/dl_tabular"
  save_models: true
  save_predictions: true
  generate_plots: true

