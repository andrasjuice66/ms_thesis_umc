# Deep Learning Tabular Configuration - Local Testing
# Uses local paths for Windows/WSL

experiment_name: "dl_tabular_resnet_local"
seed: 42
use_wandb: false  # Set to false for local testing
wandb_project: "rerun_experiments"

# Data configuration (local paths)
data:
  train_csv: "/mnt/c/Projects/thesis_project/brain_age_pred/data/labels_for_ml/train_labels.csv"
  val_csv: "/mnt/c/Projects/thesis_project/brain_age_pred/data/labels_for_ml/val_labels.csv"
  test_csv: "/mnt/c/Projects/thesis_project/brain_age_pred/data/labels_for_ml/test_labels.csv"
  segmented_data_dir: "/mnt/c/Projects/thesis_project/Data/brain_age_segmented"

# Preprocessing configuration
preprocessing:
  scaler: "standard"
  handle_missing: "median"

# Model architecture configuration
model:
  architecture: "resnet"
  hidden_dims: [512, 256, 128, 64]
  dropout: 0.3
  use_attention: true

# Training configuration (reduced for local testing)
training:
  batch_size: 64  # Smaller batch size for local
  epochs: 50  # Fewer epochs for testing
  learning_rate: 0.001
  optimizer: "adamw"
  weight_decay: 0.0001
  scheduler: "plateau"
  grad_clip: 1.0
  early_stopping_patience: 15

# Output configuration
output:
  output_dir: "output/dl_tabular"
  save_models: true
  save_predictions: true
  generate_plots: true
