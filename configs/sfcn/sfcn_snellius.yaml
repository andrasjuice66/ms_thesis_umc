# ────────────────────────────  DATA  ──────────────────────────── #
data:
  data_dir: "/scratch-shared/ajoos/"               # root that contains all images
  train_csv: "/home/ajoos/brain_age_pred/data/labels/train.csv"
  val_csv:   "/home/ajoos/brain_age_pred/data/labels/val.csv"
  test_csv:  "/home/ajoos/brain_age_pred/data/labels/test.csv"

  image_key:  "image_path"
  age_key:    "age"
  weight_key: "sample_weight"             

  # loading / caching
  cache_dir: "data/cache"
  cache_mode: "memory"   
  cache_size: 0            
  shared_cache: 0
  preload: true
  num_workers: 8
  pin_memory: false
  pin_memory_device: ""
  persistent_workers: true
  prefetch_factor: 4
  target_shape: [182, 218, 182]            # (D,H,W) after optional resize

# ───────────────────────────  MODEL  ──────────────────────────── #
model:
  type: "sfcn"                             # sfcn | resnet3d | efficientnet3d
  in_channels: 1
  dropout_rate: 0.5532
  use_attention: false                   
  checkpoint: null #"/home/ajoos/brain_age_pred/output/checkpoints/sfcn_20250522_104159/sfcn_20250522_104159_epoch057.pt"

# ────────────────  DOMAIN-RANDOMISATION / AUGS  ───────────────── #
# -------------------------------------------------------------------------
# Domain-randomisation settings
# Every key here maps 1-to-1 to a keyword argument or probability override
# accepted by the new DomainRandomizer class.
# -------------------------------------------------------------------------
domain_randomization:
  use_domain_randomization: true
  device: "cuda"
  
  # Enable tumor simulation
  use_tumor_simulation: false
  
  # Transform probabilities
  transform_probs:
    tumor: 0.3        # 30% chance of adding tumors
    flip: 0.5
    affine: 0.8
    contrast: 0.6
    gamma: 0.5
    blur: 0.4
    bias: 0.5
    noise: 0.4
    rician: 0.3
    gibbs: 0.3
    resolution: 0.5
    coarse_do: 0.3
    crop: 1.0
    
  # Tumor simulation configuration
  tumor_config:
    prob: 0.3  # Probability of applying tumor simulation
    
    # Age-based segmentation (MODIFY THESE PATHS TO YOUR SEGMENTATION FILES)
    use_age_based_segmentation: true
    segmentation_paths:
      young: "brain_age_pred/data/segmentations/seg_18_40.nii.gz"
      middle: "brain_age_pred/data/segmentations/seg_40_60.nii.gz"
      old: "brain_age_pred/data/segmentations/seg_60_85.nii.gz"
    age_ranges:
      young: [18, 40]
      middle: [40, 60]
      old: [60, 85]
    
    # Tumor generation parameters
    perlin_res: [2, 2, 2]  # Perlin noise resolution
    mask_percentile_min: 90.0
    mask_percentile_max: 99.6
    tumor_size_factor_range: [0.5, 2.0]  # Random size scaling
    pathol_thres: 0.2
    min_tumor_size: 100
    
    # Fluid dynamics (makes tumors more realistic)
    use_fluid_dynamics: true
    V_multiplier: 500.0
    dt: 0.1
    min_nt: 10
    max_nt: 20
    integ_method: 'dopri5'
    bc: 'neumann'
    
    # Intensity parameters
    modality: 'T1'  # Default modality if not in data
    intensity_variation: 0.3
    
    # Brain mask parameters (fallback when segmentation fails)
    brain_threshold: 0.1

  # Other domain randomization parameters
  progressive_epochs: 50
  progressive_start: 0.2
  scaling_range: [0.9, 1.1]
  rotation_range: 10.0
  shearing_bounds: 0.05
  contrast_range: [0.8, 1.2]
  log_gamma_std: 0.2
  bias_field_range: [0.0, 0.4]
  max_res_iso: 3.0
  coarse_dropout_size: [20, 20, 20]
  output_shape: [182, 218, 182]
  use_torchio: false

# ──────────────────────────  TRAINING  ────────────────────────── #
training:
  batch_size: 32
  epochs: 120

  # optimiser & LR
  learning_rate: 0.0022 #0.002193
  weight_decay:  0.001
  optimizer: "sgd"                       # adam | adamw | sgd | rmsprop | radam | novograd
  scheduler: "cosine"                      # cosine | plateau | onecycle | step | none
  scheduler_params:
    T_max: 100
    eta_min: 0.00001
    epochs: 100
    steps_per_epoch: 534

  # losses
  loss: "weighted_mae"                        # mse | mae | huber | huber_mae | weighted_mse
  loss_params:
    delta: 1.0
    mae_weight: 0.5

  # misc
  early_stopping_patience: 25
  gradient_accumulation_steps: 1
  use_amp: true                            # mixed precision if CUDA present

# ────────────────────────────  OUTPUT  ────────────────────────── #
output:
  output_dir: "/home/ajoos/brain_age_pred/output"
  checkpoint_dir: "checkpoints"
  log_dir: "logs"
  experiment_name: "brain_age_with_tumors"                   # auto-generate if left null

# ─────────────────────────────  W&B  ──────────────────────────── #
wandb:
  use_wandb: true                         # still requires $WANDB_API env-var
  project: "brainage-model-training"
  entity: null

# ───────────────────────── MISCELLANEOUS ───────────────────────── #
seed: 42
device: "cuda"                              # cuda if available, else cpu