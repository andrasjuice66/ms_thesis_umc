# ────────────────────────────  DATA  ──────────────────────────── #
data:
  train_csv: "/home/ajoos1/brain_age_pred/data/labels/train.csv"
  val_csv:   "/home/ajoos1/brain_age_pred/data/labels/val.csv"
  test_csv:  "/home/ajoos1/brain_age_pred/data/labels/test_balanced.csv"

  segmented_data_dir: "/scratch-shared/ajoos1/brain_age_segmented_converted/"   
  real_data_dir: "/scratch-shared/ajoos1/brain_age_preprocessed_converted/" 
  
  num_workers: 12
  pin_memory: true

# ───────────────────────────  MODEL  ──────────────────────────── #
# Model is hard-coded to MultiTaskBrainAge in train_multitask.py
# The architecture is based on SynthSeg's U-Net.
model:
  checkpoint: null # Optional path to a checkpoint to resume training
  synthseg_weights_path: "/home/ajoos1/brain_age_pred/models/synthseg_2.0.h5"

# ────────────────────── BRAIN GENERATOR ───────────────────────── #
# These settings control the on-the-fly generation of synthetic MRIs
brain_generator:
  # Prior distribution for GMM sampling (intensities)
  distribution: "uniform"  # "normal" or "uniform"
  mean_loc: 125.0          # Mid-point of distribution for means
  mean_scale: 125.0        # Half-range of distribution for means
  std_loc: 17.5            # Mid-point of distribution for standard deviations
  std_scale: 17.5          # Half-range of distribution for standard deviations
  
  # Probabilities for applying each augmentation
  prob:
    flip: 0.5
    affine: 0.9
    tumor: 0.0
    contrast: 0.5
    gamma: 0.4
    scale_int: 0.4
    shift_int: 0.4
    hist_shift: 0.4
    noise: 0.4
    rician: 0.4
    gibbs: 0.5
    blur: 0.4
    bias: 0.4
    resolution: 0.4
  
  # Spatial augmentation parameters
  rotation_range: 10
  scaling_range: 0.15
  shear_bounds: 0.01
  translation_bounds: false # Set to a value like 5.0 to enable
  
  # Intensity augmentation parameters
  contrast_range: [0.7, 1.3]
  log_gamma_std: 0.2
  shift_offset: 0.1
  hist_control_points: 8
  
  # Artefacts parameters
  noise_mean: 0.05
  noise_std: 0.05
  rician_std: 0.05
  gibbs_alpha: 0.5
  blur_sigma: 0.5
  bias_field_rng: [0.0, 0.6]
  
  # Resolution parameters (simulates different scanner resolutions)
  min_res: 0.8
  max_res_iso: 2.5
  max_res_aniso: 2.5
  atlas_res: 1.0
  
  # Shape and cropping parameters for the generator
  output_shape: [160, 192, 160]
  use_random_cropping: true
  use_sample: true
  use_hemisphere_aware_flip: true
  use_dynamic_resolution: true
  use_intensity_clip_normalize: true
  tumor_prior_means: [0.4, 0.15]
  tumor_prior_stds: [0.12, 0.04]
  tumor_perlin_res: [4, 4, 4]   
  tumor_percentile_range: [90.0, 99.6]
  tumor_size_factor_range: [0.5, 2.0]
  tumor_use_fluid_dynamics: True,        
# ──────────────────────────  TRAINING  ────────────────────────── #
training:
  batch_size: 4
  epochs: 150

  # Optimiser & LR Scheduler
  optimizer:
    optimizer_type: "adamw"
    learning_rate: 0.001
    weight_decay:  0.001
  scheduler:
    scheduler_type: "cosine" # "cosine" or "step" or "plateau"
    T_max: 150               # For cosine scheduler
    step_size: 10            # For step scheduler
    gamma: 0.5               # For step scheduler

  # Loss function parameters for Multi-Task learning
  loss:
    age_loss_fn: "mae"        # Loss for the age prediction task (mae, mse, huber)
    age_loss_weight: 1.0      # Weight for the age prediction loss
    seg_loss_weight: 5.0    # Weight for the segmentation loss (DiceCE)

  # Misc training settings
  early_stopping_patience: 30
  gradient_accumulation_steps: 1
  use_amp: true # Use Automatic Mixed Precision

# ────────────────────────────  OUTPUT  ────────────────────────── #
output:
  output_dir: "./output/multitask"
  experiment_name: "finetune_synthseg"

# ─────────────────────────────  W&B  ──────────────────────────── #
wandb:
  use_wandb: true
  project: "brain-age-multitask"
  entity: null # Your W&B entity/username, or set as environment variable

# ───────────────────────── MISCELLANEOUS ───────────────────────── #
seed: 42
device: "cuda"