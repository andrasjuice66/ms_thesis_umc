# ────────────────────────────  DATA  ──────────────────────────── #
data:
  train_csv: "/home/ajoos/brain_age_pred/data/labels/train.csv"
  val_csv:   "/home/ajoos/brain_age_pred/data/labels/val.csv"
  test_csv:  "/home/ajoos/brain_age_pred/data/labels/test_balanced.csv"

  segmented_data_dir: "/scratch-shared/ajoos/brain_age_segmented_converted/"

  num_workers: 8
  pin_memory: true

# ───────────────────────────  MODEL  ──────────────────────────── #
# Model is hard-coded to MultiTaskBrainAge in train_multitask.py
# The architecture is based on SynthSeg's U-Net.
model:
  checkpoint: null # Optional path to a checkpoint to resume training

# ────────────────────── BRAIN GENERATOR ───────────────────────── #
# These settings control the on-the-fly generation of synthetic MRIs
brain_generator:
  # Prior distribution for GMM sampling (intensities)
  distribution: "uniform"  # "normal" or "uniform"
  mean_loc: 125.0          # Mid-point of distribution for means
  mean_scale: 125.0        # Half-range of distribution for means
  std_loc: 17.5            # Mid-point of distribution for standard deviations
  std_scale: 17.5          # Half-range of distribution for standard deviations
  
  # Probabilities for applying each augmentation
  prob:
    flip: 0.5
    affine: 0.8 
    contrast: 0.5
    gamma: 0.5
    scale_int: 0.5
    shift_int: 0.5
    hist_shift: 0.3
    noise: 0.4
    rician: 0.4
    gibbs: 0.2
    blur: 0.3
    bias: 0.5
    resolution: 0.2
  
  # Spatial augmentation parameters
  rotation_range: 10
  scaling_range: 0.15
  shear_bounds: 0.01
  translation_bounds: false # Set to a value like 5.0 to enable
  
  # Intensity augmentation parameters
  contrast_range: [0.7, 1.3]
  log_gamma_std: 0.2
  shift_offset: 0.1
  hist_control_points: 8
  
  # Artefacts parameters
  noise_mean: 0.0
  noise_std: 0.02
  rician_std: 0.02
  gibbs_alpha: 0.5
  blur_sigma: 0.5
  bias_field_rng: [0.0, 0.6]
  
  # Resolution parameters (simulates different scanner resolutions)
  min_res: 0.8
  max_res_iso: 2.5
  max_res_aniso: 2.5
  atlas_res: 1.0
  
  # Shape and cropping parameters for the generator
  output_shape: [160, 192, 160]
  use_random_cropping: true

# ──────────────────────────  TRAINING  ────────────────────────── #
training:
  batch_size: 2
  epochs: 150

  # Optimiser & LR Scheduler
  optimizer:
    optimizer_type: "adamw"
    learning_rate: 0.001
    weight_decay:  0.0001
  scheduler:
    scheduler_type: "cosine" # "cosine" or "step" or "plateau"
    T_max: 150               # For cosine scheduler
    step_size: 30            # For step scheduler
    gamma: 0.5               # For step scheduler

  # Loss function parameters for Multi-Task learning
  loss:
    age_loss_fn: "mse"        # Loss for the age prediction task (mae, mse, huber)
    age_loss_weight: 1.0      # Weight for the age prediction loss
    seg_loss_weight: 0.5      # Weight for the segmentation loss (DiceCE)

  # Misc training settings
  early_stopping_patience: 30
  gradient_accumulation_steps: 1
  use_amp: true # Use Automatic Mixed Precision

# ────────────────────────────  OUTPUT  ────────────────────────── #
output:
  output_dir: "./output"
  experiment_name: "multitask_synth_v1"

# ─────────────────────────────  W&B  ──────────────────────────── #
wandb:
  use_wandb: true
  project: "brain-age-multitask"
  entity: null # Your W&B entity/username, or set as environment variable

# ───────────────────────── MISCELLANEOUS ───────────────────────── #
seed: 42
device: "cuda"