# Evaluation configuration for SFCN model

seed: 42
device: cuda
output_dir: output/evaluations
batch_size: 16
save_predictions: true

data_dir: "/scratch-shared/ajoos/"
datasets: 
  - val
  - test

dataset_paths:
  val: /home/ajoos/brain_age_pred/data/labels/val.csv
  test: /home/ajoos/brain_age_pred/data/labels/test_balanced.csv

model:
  type: sfcn_class
  in_channels: 1
  dropout_rate: 0.5
  age_min: 20
  age_max: 80
  channels: [32, 64, 128, 256, 256, 64]  # Only for sfcn_class

checkpoint_path: /home/ajoos/model_files/sfcn_original_ckp.p