# ────────────────────────────  DATA  ──────────────────────────── #
data:
  real_data_dir: "/mnt/c/Projects/thesis_project/Data/brain_age_preprocessed_no_csf/"
  segmented_data_dir: "/mnt/c/Projects/thesis_project/Data/brain_age_segmented/"   
  train_csv: "/mnt/c/Projects/thesis_project/brain_age_pred/data/labels/train_labels.csv"
  val_csv:   "/mnt/c/Projects/thesis_project/brain_age_pred/data/labels/val_labels.csv"
  test_csv:  "/mnt/c/Projects/thesis_project/brain_age_pred/data/labels/test_labels.csv"

  image_key:  "image_path"
  age_key:    "age"
  weight_key: "age_modality_frequency"

  # loading / caching (only num_workers and pin_memory are used by the new script; the rest are safe to keep)
  cache_dir: "data/cache"
  cache_mode: "memory"
  cache_size: 0
  shared_cache: 0
  preload: true
  num_workers: 8
  pin_memory: false
  pin_memory_device: ""
  persistent_workers: true
  prefetch_factor: 4
  target_shape: [160, 192, 160]
  age_min: 20
  age_max: 80

# ───────────────────────────  MODEL  ──────────────────────────── #
model:
  type: "brainagenext"           # for reference
  in_channels: 1
  dropout_rate: 0.2
  model_id: "B"
  kernel_size: 3
  deep_supervision: true
  feature_size: 512
  hidden_size: 64

  # Load your good brain-age weights into the encoder+age head
  brain_age_checkpoint: "/mnt/c/Projects/thesis_project/model_files/BrainAge_1.pth"

  # Optional: resume full multi-task (encoder+age+decoder) checkpoint
  # multitask_checkpoint: "/path/to/multitask_checkpoint.pt"

  # Legacy key; treated as multitask_checkpoint by the script if set
  # checkpoint: "/path/to/legacy_checkpoint.pt"

  # Segmentation decoder settings (UNet-style upsampling without skips)
  seg:
    # num_classes will default to len(GENERATION_LABELS); override if needed
    # num_classes: 1
    num_upsamples: 4     # set to match total encoder downsampling (2^4 typical)
    end_channels: 32
    dropout: 0.0
    norm: "in"           # "bn" or "in"

brain_generator:
  return_segmentation: true

  # Prior distribution for GMM sampling (intensities)
  distribution: "uniform"  # "normal" or "uniform"
  mean_loc: 125.0          # Mid-point of distribution for means
  mean_scale: 125.0        # Half-range of distribution for means
  std_loc: 17.5            # Mid-point of distribution for standard deviations
  std_scale: 17.5          # Half-range of distribution for standard deviations
  
  # Probabilities for applying each augmentation
  prob:
    flip: 0.5
    affine: 0.9
    tumor: 0.0
    contrast: 0.5
    gamma: 0.4
    scale_int: 0.4
    shift_int: 0.4
    hist_shift: 0.4
    noise: 0.4
    rician: 0.4
    gibbs: 0.5
    blur: 0.4
    bias: 0.4
    resolution: 0.4
    motion: 0.5          # For RandomMotion
    ghost: 0.5           # For RandomGhosting  
    torchio_noise: 0.5   # For RandomNoise
    swap: 0.5            # For RandomSwap
  
  # Spatial augmentation parameters
  rotation_range: 1
  scaling_range: 0.15
  shear_bounds: 0.01
  translation_bounds: false # Set to a value like 5.0 to enable
  
  # Intensity augmentation parameters
  contrast_range: [0.7, 1.3]
  log_gamma_std: 0.2
  shift_offset: 0.1
  hist_control_points: 8
  
  # Artefacts parameters
  noise_mean: 0.05
  noise_std: 0.05
  rician_std: 0.05
  gibbs_alpha: 0.5
  blur_sigma: 0.5
  bias_field_rng: [0.0, 0.6]
  
  # Resolution parameters (simulates different scanner resolutions)
  min_res: 0.8
  max_res_iso: 2.5
  max_res_aniso: 2.5
  atlas_res: 1.0
  
  # Shape and cropping parameters for the generator
  output_shape: [160, 192, 160]
  use_random_cropping: true
  use_sample: true
  use_hemisphere_aware_flip: true
  use_dynamic_resolution: true
  use_intensity_clip_normalize: true
  tumor_prior_means: [0.4, 0.15]
  tumor_prior_stds: [0.12, 0.04]
  tumor_perlin_res: [4, 4, 4]   
  tumor_percentile_range: [90.0, 99.6]
  tumor_size_factor_range: [0.5, 2.0]
  tumor_use_fluid_dynamics: True,       

# ──────────────────────────  TRAINING  ────────────────────────── #
training:
  batch_size: 2
  epochs: 120

  # Optimizer & Scheduler (MultiTaskTrainer-compatible style)
  optimizer:
    optimizer_type: "adamw"
    learning_rate: 0.0001     # finetune-friendly; adjust up to 3e-4 if needed
    weight_decay: 0.001

  scheduler:
    scheduler_type: "cosine"  # "cosine" | "step" | "plateau" | "none"
    T_max: 120
    step_size: 10
    gamma: 0.8

  # Multi-task loss settings; trainer should read these
  loss:
    age_loss_fn: "mae"        # mae | mse | huber
    seg_loss_fn: "dice"       # dice for segmentation
    include_background: true
    softmax: true             # set true for multi-class; set false and use sigmoid if binary
    to_onehot_y: true         # for multi-class targets
    weights:
      age: 1.0
      seg: 1.0

  early_stopping_patience: 30
  gradient_accumulation_steps: 1
  use_amp: true

  # Optional toggles used by the new script
  age_only_mode: false        # if true, trains only age head (seg head frozen)
  freeze_encoder: false       # only meaningful when age_only_mode is true

# ────────────────────────────  OUTPUT  ────────────────────────── #
output:
  output_dir: "/mnt/c/Projects/thesis_project/run_output/brainagenext_multitask_finetune"
  checkpoint_dir: "checkpoints"
  log_dir: "logs"
  experiment_name: "brainagenext_multitask_finetune"

# ─────────────────────────────  W&B  ──────────────────────────── #
wandb:
  use_wandb: true
  project: "paper_check"
  entity: null

# ───────────────────────── MISCELLANEOUS ───────────────────────── #
seed: 42
device: "cuda"