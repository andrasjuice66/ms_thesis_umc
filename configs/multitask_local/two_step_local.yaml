# ────────────────────────────  DATA  ──────────────────────────── #
data:
  train_csv: "/mnt/c/Projects/thesis_project/brain_age_pred/data/labels/train_labels.csv"
  val_csv:   "/mnt/c/Projects/thesis_project/brain_age_pred/data/labels/val_labels.csv"
  test_csv:  "/mnt/c/Projects/thesis_project/brain_age_pred/data/labels/test_labels.csv"

  segmented_data_dir: "/mnt/c/Projects/thesis_project/Data/brain_age_segmented/"   
  real_data_dir: "/mnt/c/Projects/thesis_project/Data/brain_age_preprocessed/"   


  num_workers: 2
  pin_memory: false

# ───────────────────────────  MODEL  ──────────────────────────── #
# Model is hard-coded to MultiTaskBrainAge in train_multitask.py
# The architecture is based on SynthSeg's U-Net.
model:
  checkpoint: null # Optional path to a checkpoint to resume training

# ────────────────────── BRAIN GENERATOR ───────────────────────── #
# These settings control the on-the-fly generation of synthetic MRIs
brain_generator:
  # Prior distribution for GMM sampling (intensities)
  distribution: "uniform"  # "normal" or "uniform"
  mean_loc: 125.0          # Mid-point of distribution for means: (25 + 225) / 2 = 125
  mean_scale: 100.0        # Half-range of distribution for means: (225 - 25) / 2 = 100
  std_loc: 15.0            # Mid-point of distribution for standard deviations: (5 + 25) / 2 = 15
  std_scale: 10.0          # Half-range of distribution for standard deviations: (25 - 5) / 2 = 10
  
  # Probabilities for applying each augmentation
  prob:
    flip: 0.5
    affine: 0.9
    tumor: 0.0
    contrast: 0.5
    gamma: 0.4
    scale_int: 0.4
    shift_int: 0.4
    hist_shift: 0.4
    noise: 0.4
    rician: 0.4
    gibbs: 0.5
    blur: 0.4
    bias: 0.4
    resolution: 0.4
    motion: 0.0        # For RandomMotion
    ghost: 0.0           # For RandomGhosting  
    torchio_noise: 0.0   # For RandomNoise
    swap: 0.0            # For RandomSwap
  
  # Spatial augmentation parameters
  rotation_range: 10
  scaling_range: 0.15
  shear_bounds: 0.01
  translation_bounds: false # Set to a value like 5.0 to enable
  
  # Intensity augmentation parameters
  contrast_range: [0.7, 1.3]
  log_gamma_std: 0.2
  shift_offset: 0.1
  hist_control_points: 8
  
  # Artefacts parameters
  noise_mean: 0.05
  noise_std: 0.05
  rician_std: 0.05
  gibbs_alpha: 0.5
  blur_sigma: 0.5
  bias_field_rng: [0.0, 0.6]
  
  # Resolution parameters (simulates different scanner resolutions)
  min_res: 0.8
  max_res_iso: 2.5
  max_res_aniso: 2.5       # NEW: Maximum anisotropic resolution
  atlas_res: 1.0
  thickness: null          # NEW: Slice thickness factor (null uses atlas_res)
  
  # Motion artifacts parameters (TorchIO RandomMotion)
  motion_degrees: 3.0      # NEW: Maximum rotation in degrees
  motion_translation: 5.0  # NEW: Maximum translation in mm
  motion_num_transforms: 4 # NEW: Number of motion transforms to apply
  
  # Ghosting artifacts parameters (TorchIO RandomGhosting)
  ghost_num: [1, 4]        # NEW: Range for number of ghosts [min, max]
  ghost_intensity: [0.1, 0.6] # NEW: Range for ghost intensity [min, max]
  
  # TorchIO noise parameters
  torchio_noise_std: [0, 0.5] # NEW: Standard deviation range for TorchIO noise
  
  # Generator configuration parameters
  n_channels: 1            # NEW: Number of input channels
  use_specific_stats_for_channel: false # NEW: Use channel-specific statistics
  return_gradients: false  # NEW: Whether to return gradients
  return_segmentation: true # NEW: Whether to return segmentation masks
  
  # Shape and cropping parameters for the generator
  output_shape: [160, 192, 160]
  use_random_cropping: true
  use_sample: true
  use_hemisphere_aware_flip: true
  use_dynamic_resolution: true
  use_intensity_clip_normalize: true
  
  # Tumor generation parameters
  tumor_prior_means: [0.4, 0.15]
  tumor_prior_stds: [0.12, 0.04]
  tumor_perlin_res: [4, 4, 4]   
  tumor_percentile_range: [90.0, 99.6]
  tumor_size_factor_range: [0.5, 2.0]
  tumor_use_fluid_dynamics: True   
  
  
# ──────────────────────────  TRAINING  ────────────────────────── #
training:
  batch_size: 1
  epochs: 150
  
  # Two-step training configuration
  seg_pretrain_epochs: 20  # Number of epochs for segmentation-only pretraining

  # Optimiser & LR Scheduler for Stage 1 (Segmentation pretraining)
  optimizer:
    optimizer_type: "adamw"
    learning_rate: 0.001
    weight_decay:  0.0001
    
  # Optional: Different optimizer settings for Stage 2 (Multi-task fine-tuning)
  # If not specified, will use the same settings as 'optimizer' above
  finetune_optimizer:
    optimizer_type: "adamw"
    learning_rate: 0.0005   # Often use a lower LR for fine-tuning
    weight_decay:  0.0001
    
  scheduler:
    scheduler_type: "cosine" # "cosine" or "step" or "plateau"
    T_max: 150               # For cosine scheduler
    step_size: 30            # For step scheduler
    gamma: 0.5               # For step scheduler

  # Loss function parameters for Multi-Task learning
  loss:
    age_loss_fn: "mae"        # Loss for the age prediction task (mae, mse, huber)
    age_loss_weight: 1.0      # Weight for the age prediction loss
    seg_loss_weight: 5.0    # Weight for the segmentation loss (DiceCE)

  # Misc training settings
  early_stopping_patience: 30
  gradient_accumulation_steps: 1
  use_amp: true # Use Automatic Mixed Precision

# ────────────────────────────  OUTPUT  ────────────────────────── #
output:
  output_dir: "./output/two_step"
  experiment_name: "two_step_local"

# ─────────────────────────────  W&B  ──────────────────────────── #
wandb:
  use_wandb: true
  project: "rerun_experiments"
  entity: null # Your W&B entity/username, or set as environment variable

# ───────────────────────── MISCELLANEOUS ───────────────────────── #
seed: 42
device: "cuda"