# Configuration for the evaluation script

# Directory where evaluation outputs (logs, results) will be saved
output_dir: "output/evaluation_all_models"

# Default directory where the real image data (NIfTI files, etc.) is stored.
# This can be overridden on a per-model basis.
data_dir: "/scratch-shared/ajoos/brain_age_preprocessed_converted/"

# Device to run evaluation on ('cuda', 'cpu', or null to auto-detect)
device: "cuda"

# DataLoader settings
batch_size: 8
num_workers: 4

# --- Models to Evaluate ---
# List of models, each with a name, checkpoint path, and parameters.
models:
  - name: "sfcn_baseline"
    checkpoint: "/home/ajoos/brain_age_pred/output/checkpoints/sfcn_class_baseline/sfcn_class_baseline_best_mae.pt"
    params:
      type: "sfcn_class"
      in_channels: 1
      dropout_rate: 0.5
      age_min: 20
      age_max: 80

  - name: "sfcn_dom_rand"
    checkpoint: "/home/ajoos/brain_age_pred/output/checkpoints/sfcn_class_dom_rand/sfcn_class_dom_rand_best_mae.pt"
    params:
      type: "sfcn_class"
      in_channels: 1
      dropout_rate: 0.5
      age_min: 20
      age_max: 80

  - name: "brainagenext_baseline"
    checkpoint: "/home/ajoos/brain_age_pred/output/checkpoints/brainagenext_baseline/brainagenext_baseline_best_mae.pt"
    params:
      type: "brainagenext"
      in_channels: 1
      dropout_rate: 0.0
      model_id: "B"
      feature_size: 512
      hidden_size: 64

  - name: "brainagenext_dom_rand"
    checkpoint: "/home/ajoos/brain_age_pred/output/checkpoints/brainagenext_dom_rand/brainagenext_dom_rand_best_mae.pt"
    params:
      type: "brainagenext"
      in_channels: 1
      dropout_rate: 0.2
      model_id: "B"
      feature_size: 512
      hidden_size: 64

  - name: "sfcn_seg_map"
    checkpoint: "/home/ajoos/brain_age_pred/output/checkpoints/sfcn_class_seg_map/sfcn_class_seg_map_best_mae.pt"
    data_dir: "/scratch-shared/ajoos/brain_age_segmented_converted/" # Override data directory for this model
    params:
      type: "sfcn_class"
      in_channels: 15 # Number of segmentation classes
      dropout_rate: 0.3
      age_min: 20
      age_max: 80

  - name: "brainagenext_seg_map"
    checkpoint: "path/to/brainagenext_seg_map/best_model.pth"
    data_dir: "/scratch-shared/ajoos/brain_age_segmented_converted/" # Override data directory
    params:
      type: "brainagenext"
      in_channels: 15 # Number of segmentation classes
      dropout_rate: 0.0
      model_id: "B"
      feature_size: 512
      hidden_size: 64

  - name: "multitask"
    checkpoint: "path/to/multitask/best_model.pth"
    params:
      type: "multitask"
      n_classes: 45 # Number of segmentation classes for the decoder head

# --- Test Sets for Evaluation ---
# List of test sets, each with a name and a path to its CSV file.
testing:
  - name: "InternalTestSet"
    csv_path: "data/splits/internal_test.csv"

  - name: "ExternalTestSet_A"
    csv_path: "data/splits/external_test_A.csv" 