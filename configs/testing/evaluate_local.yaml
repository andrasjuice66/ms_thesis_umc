# Configuration for the evaluation script

# Directory where evaluation outputs (logs, results) will be saved
output_dir: "/mnt/c/Projects/thesis_project/brain_age_pred/output/evaluation_all_models"

# Directory where all plots are saved (scatter, bar charts, GradCAM).
# Defaults to <output_dir>/plots if not set.
plots_dir: "/mnt/c/Projects/thesis_project/paper_plots"

# Default directory where the real image data (NIfTI files, etc.) is stored.
# This can be overridden on a per-model basis.
data_dir: "/mnt/c/Projects/thesis_project/Data/brain_age_preprocessed/"

# Device to run evaluation on ('cuda', 'cpu', or null to auto-detect)
device: "cuda"

# DataLoader settings
batch_size: 4
num_workers: 2

wandb:
  use_wandb: true
  project: "final_evaluation"
  entity: null
  experiment_name: "OODTestSets_PDw"  # optional, auto-generated if not provided

# --- GradCAM Visualisation ---
# Generates orthogonal-slice heatmaps for a small sample per modality per test set.
# Figures are saved under <output_dir>/plots/gradcam/ and logged to W&B if enabled.
gradcam:
  enabled: false
  n_samples_per_modality: 2       # individual plots: subjects per modality
  atlas_path: "/mnt/c/Projects/thesis_project/Data/MNI152_T1_1mm_Brain.nii.gz"  # MNI152 background for average plots

# --- Bias Correction (Smith et al., 2019) ---
# Fits x = a*y + b on the named validation set, then applies x_corrected = (x - b) / a
# to all test sets (including the validation set itself).
bias_correction:
  enabled: true
  fit_on: "ValidationSet"  # must match a name in the 'testing' list below

# --- Models to Evaluate ---
# List of models, each with a name, checkpoint path, and parameters.
models:

  - name: "brainagenext_t1"
    checkpoint: "/mnt/c/Projects/thesis_project/best_models/best_models/brainagenext_t1_augmented_final_best_mae.pt"
    bias_correction_modality: "t1"  # fit and apply correction on T1 subjects only
    params:
      type: "brainagenext"
      in_channels: 1
      dropout_rate: 0.0
      model_id: "B"
      feature_size: 512
      hidden_size: 64
      normalize: true



  - name: "brainagenext"
    checkpoint: "/mnt/c/Projects/thesis_project/best_models/best_models/brainagenext_augmented_final_best_mae.pt"
    params:
      type: "brainagenext"
      in_channels: 1
      dropout_rate: 0.0
      model_id: "B"
      feature_size: 512
      hidden_size: 64
      normalize: true

  - name: "sfcn_seg_map"
    checkpoint: "/mnt/c/Projects/thesis_project/best_models/best_models/sfcn_class_seg_map_final_best_mae.pt"
    data_dir: "/mnt/c/Projects/thesis_project/Data/brain_age_segmented/" # Override data directory for this model
    params:
      type: "sfcn_class"
      in_channels: 15 # Number of segmentation classes
      dropout_rate: 0.3
      age_min: 20
      age_max: 80
      track_running_stats: false
      normalize: false

  - name: "two_step"
    checkpoint: "/mnt/c/Projects/thesis_project/best_models/best_models/two_step_final_2_best_mae.pt"
    params:
      type: "multitask"
      n_classes: 33
      normalize: true


# --- Test Sets for Evaluation ---
# List of test sets, each with a name and a path to its CSV file.
testing:

  - name: "ValidationSet"
    csv_path: "/mnt/c/Projects/thesis_project/brain_age_pred/data/labels/val_labels.csv"

  # - name: "TestSet"
  #   csv_path: "/mnt/c/Projects/thesis_project/brain_age_pred/data/labels/test_labels.csv"

  # - name: "MovementNoiseTestSet"
  #   csv_path: "/mnt/c/Projects/thesis_project/brain_age_pred/data/labels/test_movement_noise.csv" 
    
  - name: "OODTestSet"
    csv_path: "/mnt/c/Projects/thesis_project/brain_age_pred/data/labels/test_ood_pdw.csv"  

  - name: "OODTestSet_IXI"
    csv_path: "/mnt/c/Projects/thesis_project/brain_age_pred/data/labels/test_ood_pdw_ixi.csv" 

  - name: "OODTestSet_IXI_Original"
    csv_path: "/mnt/c/Projects/thesis_project/brain_age_pred/data/labels/test_ood_pdw_ixi_original.csv" 
